[package]
name = "pixi-mask"
version = "0.1.0"
edition = "2021"
authors = ["Makoto"]
description = "Fast secret masking for text on its way into a model context"
license = "MIT"

[dependencies]
aho-corasick = "1"
base64 = "0.22"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
